<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Colour Sneaker Drops</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<h1 class="page-title">SNEAKER DROPS</h1>

<div class="container">

    <!-- PRODUCT 1 -->
    <div class="product-card pink">
        <span class="badge new">NEW DROP</span>

        <div class="image-grid">
            <img src="https://images.unsplash.com/photo-1528701800489-20be1c62f8ae">
            <img src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519">
            <img src="https://images.unsplash.com/photo-1606813902919-d5c4b93eae4d">
        </div>

        <div class="product-info">
            <h2>URBAN RUNNER</h2>
            <p class="tagline">Street Energy</p>

            <div class="sizes">
                <span>6</span><span>7</span><span>8</span><span>9</span><span>10</span>
            </div>

            <div class="price">₹4,999</div>
            <button class="btn">ADD TO CART</button>
        </div>
    </div>

    <!-- PRODUCT 2 -->
    <div class="product-card blue">
        <span class="badge limited">LIMITED</span>

        <div class="image-grid">
            <img src="https://images.unsplash.com/photo-1605348532760-6753d2c43329">
            <img src="https://images.unsplash.com/photo-1603808033192-082d6919d3e1">
            <img src="https://images.unsplash.com/photo-1519744792095-2f2205e87b6f">
        </div>

        <div class="product-info">
            <h2>BLACK STREET</h2>
            <p class="tagline">Bold & Loud</p>

            <div class="sizes">
                <span>7</span><span>8</span><span>9</span><span>10</span>
            </div>

            <div class="price">₹5,499</div>
            <button class="btn">ADD TO CART</button>
        </div>
    </div>

    <!-- PRODUCT 3 -->
    <div class="product-card purple">

        <div class="image-grid">
            <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">
            <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3">
        </div>

        <div class="product-info">
            <h2>RETRO FLEX</h2>
            <p class="tagline">Classic Remix</p>

            <div class="sizes">
                <span>6</span><span>7</span><span>8</span><span>9</span>
            </div>

            <div class="price">₹3,999</div>
            <button class="btn">ADD TO CART</button>
        </div>
    </div>

</div>

</body>
</html>
