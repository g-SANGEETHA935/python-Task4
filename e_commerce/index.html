<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sneaker Streetwear</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>STREET KICKS</h1>
        <p>Premium Sneakers for Street Style</p>
    </header>

    <!-- Product Section -->
    <section class="product-grid">

        <div class="product-card">
            <img src="https://bhatiaenterprise.in/wp-content/uploads/2024/10/jj.jpg" alt="Sneaker 1">
            <h2>Urban Flex</h2>
            <p class="price">₹3,499</p>
            <p class="desc">Comfort meets street fashion.</p>
        </div>

        <div class="product-card">
            <img src="https://bskmotosport.com/cdn/shop/files/71IHnkcO2DL._AC_SY695.jpg?v=1730470683&width=1445" alt="Sneaker 2">
            <h2>Night Runner</h2>
            <p class="price">₹4,299</p>
            <p class="desc">Designed for bold night moves.</p>
        </div>

        <div class="product-card">
            <img src="https://www.royalfashion.de/hpeciai/f2946c4f55fbb1104388009e006a6a7f/ger_pl_Royalfashion-Sportliche-Damen-Sneakers-Street-Pulse-549401_9.webp" alt="Sneaker 3">
            <h2>Street Pulse</h2>
            <p class="price">₹3,999</p>
            <p class="desc">Feel the pulse of the streets.</p>
        </div>

    </section>

</body>
</html>
